name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      MIGRATION_TEST_ADMIN_URL: jdbc:postgresql://localhost:5432/postgres
      MIGRATION_TEST_USER: username
      MIGRATION_TEST_PASSWORD: password
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: username
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ta7ady
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U username -d ta7ady"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - working-directory: ta7ady-backend
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ta7ady-frontend/package-lock.json
      - working-directory: ta7ady-frontend
        run: npm ci
      - working-directory: ta7ady-frontend
        run: npx ng build
      - working-directory: ta7ady-frontend
        run: npx ng test --watch=false

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify fresh Compose schema initialization and restart safety
        run: ./docker/postgres/verify-init.sh
      - run: docker build -f ta7ady-backend/Dockerfile -t masa2o-ta7ady-backend:ci ta7ady-backend
      - run: docker build -f ta7ady-frontend/Dockerfile -t masa2o-ta7ady-frontend:ci ta7ady-frontend

  # CD: tags only (e.g. git tag v2.1.0 && git push --tags).
  # Pushes both images to GHCR. No extra secrets needed:
  # auth uses the automatic secrets.GITHUB_TOKEN.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [backend, frontend, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="ghcr.io/${{ github.repository }}"
          docker build -f ta7ady-backend/Dockerfile -t "$REPO-backend:$TAG" -t "$REPO-backend:latest" ta7ady-backend
          docker build -f ta7ady-frontend/Dockerfile -t "$REPO-frontend:$TAG" -t "$REPO-frontend:latest" ta7ady-frontend
          docker push "$REPO-backend:$TAG"
          docker push "$REPO-backend:latest"
          docker push "$REPO-frontend:$TAG"
          docker push "$REPO-frontend:latest"
