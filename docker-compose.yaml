services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ta7ady
      PGDATA: ${PGDATA:?Set PGDATA only after confirming a fresh database or inspecting existing data/mounts; see docs/DATABASE_MIGRATIONS.md}
    ports:
      - "5432:5432"
    volumes:
      - postgres:/data/postgres
      - ./docker/postgres/init/10-create-ta7ady-schema.sh:/docker-entrypoint-initdb.d/10-create-ta7ady-schema.sh:ro
    networks:
      - ta7ady-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U username -d ta7ady"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  ta7ady-network:
    driver: bridge

volumes:
  postgres:
    driver: local
