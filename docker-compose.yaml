services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ta7ady
    ports:
      - "5432:5432"
    volumes:
      - postgres:/data/postgres
    networks:
      - ta7ady-network

networks:
  ta7ady-network:
    driver: bridge

volumes:
  postgres:
    driver: local