spring:
  application:
    name: ta7ady-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/ta7ady
    username: username
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 50MB
springdoc:
  default-produces-media-type: application/json
server:
  error:
    include-stacktrace: never
    include-message: always
admin:
  password: ${ADMIN_PASSWORD:admin}
application:
  file:
    uploads:
      media-output-path: ./upload