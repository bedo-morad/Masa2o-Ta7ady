# Minimal prod server for the Angular SPA.
# The built frontend hardcodes http://localhost:8080/api (see api.service.ts),
# so sub_filter rewrites it to same-origin /api at serve time (no src change).
# /api/ is reverse-proxied to the backend container.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Rewrite the hardcoded dev API base to same-origin (covers index.html + JS bundles).
    sub_filter 'http://localhost:8080/api' '/api';
    sub_filter_once off;
    sub_filter_types application/javascript text/css;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_proxied any;

    # Never cache the entry point (hashed bundles are safe to cache long-term).
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /api/ {
        # Variable forces DNS resolution per request (via compose embedded DNS),
        # so nginx also starts standalone (e.g. smoke tests) without "backend".
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_backend http://backend:8080;
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
