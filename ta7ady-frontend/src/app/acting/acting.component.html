<div class="challenge">
  <app-game-header title="التمثيل" />

  <app-scoreboard [(teamA)]="teamA" [(teamB)]="teamB" [(scoreA)]="scoreA" [(scoreB)]="scoreB" />

  <app-timer timerKey="acting" [defaultSeconds]="45" label="مؤقت التمثيل" />
  <app-timer timerKey="actingSteal" [defaultSeconds]="10" label="مؤقت السرقة" />

  <app-count-selector
    controlId="ac-count"
    label="عدد البطاقات"
    [count]="count()"
    [options]="[5, 10, 15, 20]"
    [loading]="deck.loading()"
    (countChanged)="count.set($event)"
    (redraw)="deck.reload()"
  />

  <app-player-deck #deck [count]="count()" />
</div>
