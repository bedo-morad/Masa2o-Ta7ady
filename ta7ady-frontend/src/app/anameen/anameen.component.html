<div class="challenge">
  <app-game-header title="أنا مين" />

  <app-scoreboard [(teamA)]="teamA" [(teamB)]="teamB" [(scoreA)]="scoreA" [(scoreB)]="scoreB" />

  <app-timer timerKey="anameen" [defaultSeconds]="60" label="مؤقت التلميح" />

  <app-count-selector
    controlId="am-count"
    label="عدد المجهولين"
    [count]="count()"
    [options]="counts"
    [loading]="loading()"
    (countChanged)="setCount($event)"
    (redraw)="reload()"
  />

  @if (msg()) {
    <div class="notice">{{ msg() }}</div>
  }

  @if (current(); as subject) {
    <app-item-navigation
      [items]="subjects()"
      [index]="idx()"
      itemLabel="المجهول"
      itemsLabel="المجهولون"
      (previous)="prev()"
      (next)="next()"
      (select)="go($event)"
    />

    <section class="dossier" aria-label="ملف اللاعب المجهول">
      <header class="dossier-head">
        <span class="pos tabular-nums">{{ idx() + 1 }}/{{ subjects().length }}</span>
        <span class="hint">{{ subject.clues.length }} تلميحات — أصعب أولًا</span>
        <button
          type="button"
          class="dice"
          (click)="reroll(idx())"
          [disabled]="rerolling()"
          [attr.aria-label]="'دسّة لاعب جديد للمجهول ' + (idx() + 1)"
        >
          <i
            class="fa-solid"
            [class.fa-dice]="!rerolling()"
            [class.fa-spinner]="rerolling()"
            aria-hidden="true"
          ></i>
        </button>
      </header>

      <ol class="slats">
        @for (clue of subject.clues; track $index; let k = $index) {
          <li class="slat" [class.asked]="asked(k + 1)">
            <span class="no tabular-nums">{{ k + 1 }}</span>
            <p class="text">{{ clue }}</p>
            <button
              appAskedMarker
              [number]="k + 1"
              [pressed]="asked(k + 1)"
              [ariaLabel]="'تحديد التلميح ' + (k + 1) + ' على أنه طُرح'"
              (marked)="toggleAsked($event)"
            ></button>
          </li>
        }
      </ol>

      <p class="answer" aria-label="اسم اللاعب">{{ subject.player }}</p>
    </section>

    <section class="solve" aria-label="احتساب الإجابة">
      <p class="solve-lead">من خمّن صح؟</p>
      <app-attribution
        [label]="subject.player"
        [points]="points"
        [assigned]="assigned(subject.id)"
        [teamA]="teamA() || 'الفريق الأول'"
        [teamB]="teamB() || 'الفريق الثاني'"
        [showPoints]="false"
        [stretch]="true"
        (change)="onAssign($event)"
      />
    </section>
  }
</div>
