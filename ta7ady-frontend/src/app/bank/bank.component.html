<div class="challenge">
  <app-game-header title="البنك" />

  @if (startTeam(); as starter) {
    <section class="order-row" aria-label="الفريق البادئ">
      <span class="order-chip">
        <i class="fa-solid fa-flag-checkered" aria-hidden="true"></i>
        {{ nameOf(starter) }}
      </span>
      <button type="button" class="new-game" (click)="newGame()" [disabled]="loading()">
        <i class="fa-solid fa-rotate-left" aria-hidden="true"></i> لعبة جديدة
      </button>
    </section>
    <app-scoreboard [(teamA)]="teamA" [(teamB)]="teamB" [(scoreA)]="scoreA" [(scoreB)]="scoreB" />

    <app-timer timerKey="bank" [defaultSeconds]="120" label="مؤقت الدور" />

    <app-bank-question-card
      [question]="currentQuestion()"
      [position]="qIdx()"
      [count]="qCount()"
      (previous)="qPrev()"
      (next)="qNext()"
    />

    <app-bank-chain-controls
      [value]="chainOf(idx())"
      [max]="maxChain"
      [saved]="bankedOf(idx())"
      [team]="nameOf(teamOfRound(idx()))"
      (correct)="correct()"
      (miss)="miss()"
      (bank)="bank()"
    />

    <div class="nav-row">
      <button
        type="button"
        class="navbtn"
        (click)="prev()"
        [disabled]="idx() === 0"
        aria-label="الدور السابق"
      >
        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
      </button>
      <div class="dots" role="group" aria-label="الأدوار الستة">
        @for (r of rounds; track r) {
          <button
            type="button"
            class="dot"
            [class.on]="r === idx()"
            [class.team-a]="teamOfRound(r) === 'A'"
            [class.team-b]="teamOfRound(r) === 'B'"
            (click)="go(r)"
            [attr.aria-label]="'الدور ' + (r + 1)"
          >
            <span class="dot-no tabular-nums">{{ r + 1 }}</span>
          </button>
        }
      </div>
      <button
        type="button"
        class="navbtn"
        (click)="next()"
        [disabled]="idx() >= rounds.length - 1"
        aria-label="الدور التالي"
      >
        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
      </button>
    </div>
  } @else {
    <section class="gate" aria-label="اختيار الفريق البادئ">
      <h3 class="gate-title">مين يبدأ؟</h3>
      <div class="gate-buttons">
        <button type="button" class="gate-btn team-a" (click)="pickStart('A')">
          {{ nameOf('A') }}
        </button>
        <button type="button" class="gate-btn team-b" (click)="pickStart('B')">
          {{ nameOf('B') }}
        </button>
      </div>
    </section>
  }

  @if (msg()) {
    <div class="notice">{{ msg() }}</div>
  }
</div>
