<div class="home">
  <header class="hero">
    <div class="menu-actions">
      <button type="button" class="gear" (click)="openSettings()" aria-label="فتح الإعدادات">
        <i class="fa-solid fa-gear"></i>
      </button>
      <a routerLink="/game-wheel" class="wheel-link" aria-label="عجلة اختيار لعبة">
        <i class="fa-solid fa-dharmachakra" aria-hidden="true"></i>
      </a>
    </div>
    <h1>مسائو تحدي</h1>
  </header>

  <nav class="play-grid" aria-label="التحديات">
    @for (game of games; track game.id) {
      <a [routerLink]="game.route" class="play-btn">{{ game.name }}</a>
    }
  </nav>

  <a routerLink="/manage" class="manage-link">
    <i class="fa-solid fa-database"></i>
    إدارة الأسئلة
  </a>
</div>

@if (settingsOpen()) {
  <app-settings-modal (closed)="closeSettings()" />
}
