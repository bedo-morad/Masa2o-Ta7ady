<div class="challenge">
  <div class="topbar">
    <a routerLink="/" class="back"><i class="fa-solid fa-arrow-right"></i> رجوع</a>
    <a routerLink="/manage" class="manage"><i class="fa-solid fa-database"></i> إدارة الأسئلة</a>
  </div>

  <h2>اهبد صح</h2>

  <app-scoreboard [(teamA)]="teamA" [(teamB)]="teamB" [(scoreA)]="scoreA" [(scoreB)]="scoreB" />

  <app-timer timerKey="ihbid" [defaultSeconds]="30" label="مؤقت الكتابة" />

  <div class="draw-row">
    <label for="ih-count">عدد الأسئلة</label>
    <select
      id="ih-count"
      [ngModel]="count()"
      (ngModelChange)="countChanged($event)"
    >
      <option [ngValue]="5">5</option>
      <option [ngValue]="10">10</option>
      <option [ngValue]="15">15</option>
      <option [ngValue]="20">20</option>
    </select>
    <button type="button" class="redraw" (click)="reload()" [disabled]="loading()">
      <i class="fa-solid fa-shuffle"></i> سحب جديد
    </button>
  </div>

  @if (msg()) {
    <div class="notice">{{ msg() }}</div>
  }

  <ol class="qlist">
    @for (q of rows(); track q.id; let i = $index) {
      <li class="qitem">
        <div class="qtext">
          <button
            type="button"
            class="qnum asked-mark tabular-nums"
            [attr.name]="'asked-question-' + (i + 1)"
            (click)="toggleAsked(i)"
            [attr.aria-pressed]="asked().has(i)"
            [attr.aria-label]="'تحديد السؤال ' + (i + 1) + ' على أنه طُرح'"
          >
            {{ i + 1 }}
          </button>
          <span class="qbody">{{ q.questionText }}</span>
          <a
            class="gq"
            [href]="googleUrl(q.questionText)"
            target="_blank"
            rel="noopener"
            aria-label="بحث عن السؤال"
            title="بحث"
          >
            <i class="fa-brands fa-google"></i>
          </a>
        </div>
        <div class="qactions">
          @if (revealed().has(q.id)) {
            <div class="answer">
              <span class="value">{{ q.answerText }}</span>
              <button type="button" class="mini" (click)="toggle(q.id)">
                <i class="fa-solid fa-eye-slash"></i> إخفاء
              </button>
            </div>
          } @else {
            <button type="button" class="mini ghost" (click)="toggle(q.id)">
              <i class="fa-solid fa-eye"></i> إظهار الجواب للحكم
            </button>
          }
          <button
            type="button"
            class="mini reroll"
            (click)="rerollOne(i)"
            [disabled]="rerolling() !== null"
            aria-label="تبديل هذا السؤال"
            title="تبديل"
          >
            <i class="fa-solid fa-dice"></i>
          </button>
        </div>
      </li>
    }
  </ol>
</div>
