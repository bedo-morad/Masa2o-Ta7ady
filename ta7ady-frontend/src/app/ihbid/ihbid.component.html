<div class="challenge">
  <app-game-header title="اهبد صح" />

  <app-scoreboard [(teamA)]="teamA" [(teamB)]="teamB" [(scoreA)]="scoreA" [(scoreB)]="scoreB" />

  <app-timer timerKey="ihbid" [defaultSeconds]="30" label="مؤقت الكتابة" />

  <app-count-selector
    controlId="ih-count"
    label="عدد الأسئلة"
    [count]="count()"
    [options]="[5, 10, 15, 20]"
    [loading]="loading()"
    (countChanged)="countChanged($event)"
    (redraw)="reload()"
  />

  @if (msg()) {
    <div class="notice">{{ msg() }}</div>
  }

  <ol class="qlist">
    @for (q of rows(); track q.id; let i = $index) {
      <li class="qitem">
        <div class="qtext">
          <button
            appAskedMarker
            class="qnum"
            [attr.name]="'asked-question-' + (i + 1)"
            [number]="i + 1"
            [pressed]="asked().has(i)"
            [ariaLabel]="askedLabel(i)"
            (marked)="toggleAsked($event)"
          ></button>
          <span class="qbody">{{ q.questionText }}</span>
          <a class="gq" [appGoogleSearch]="q.questionText"></a>
        </div>
        <div class="qactions">
          @if (revealed().has(q.id)) {
            <div class="answer">
              <span class="value">{{ q.answerText }}</span>
              <button type="button" class="mini" (click)="toggle(q.id)">
                <i class="fa-solid fa-eye-slash"></i> إخفاء
              </button>
            </div>
          } @else {
            <button type="button" class="mini ghost" (click)="toggle(q.id)">
              <i class="fa-solid fa-eye"></i> إظهار الجواب للحكم
            </button>
          }
          <button
            type="button"
            class="mini reroll"
            (click)="rerollOne(i)"
            [disabled]="rerolling() !== null"
            aria-label="تبديل هذا السؤال"
            title="تبديل"
          >
            <i class="fa-solid fa-dice"></i>
          </button>
        </div>
      </li>
    }
  </ol>
</div>
