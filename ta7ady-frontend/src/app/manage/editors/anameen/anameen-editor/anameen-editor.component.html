@if (mode() === 'add') {
  <form class="add column" (ngSubmit)="editor().add()">
    <input
      [(ngModel)]="editor().subject"
      name="nsubj"
      placeholder="اسم الشخصية — مثال: محمد صلاح"
    />
    <ol class="ranks">
      @for (clue of slots; track clue; let i = $index) {
        <li>
          <span class="rank tabular-nums" aria-hidden="true">{{ clue }}</span>
          <input
            [ngModel]="editor().clues()[i]"
            (ngModelChange)="editor().setClue(i, $event)"
            [name]="'nclue' + clue"
            [placeholder]="'التلميح رقم ' + clue"
            [attr.aria-label]="'التلميح رقم ' + clue"
          />
        </li>
      }
    </ol>
    <button type="submit"><i class="fa-solid fa-plus"></i> إضافة شخصية</button>
  </form>
} @else {
  <form class="edit column" (ngSubmit)="editor().save(id()!)">
    <input
      [(ngModel)]="editor().editSubject"
      name="editSubject"
      placeholder="اسم الشخصية"
      aria-label="تعديل اسم الشخصية"
    />
    <ol class="ranks">
      @for (clue of slots; track clue; let i = $index) {
        <li>
          <span class="rank tabular-nums" aria-hidden="true">{{ clue }}</span>
          <input
            [ngModel]="editor().editClues()[i]"
            (ngModelChange)="editor().setEditClue(i, $event)"
            [name]="'eclue' + clue"
            [placeholder]="'التلميح رقم ' + clue"
            [attr.aria-label]="'تعديل التلميح رقم ' + clue"
          />
        </li>
      }
    </ol>
    <div class="edit-actions">
      <button type="submit" class="save"><i class="fa-solid fa-check"></i> حفظ</button>
      <button type="button" class="cancel" (click)="editor().hostCancel()">إلغاء</button>
    </div>
  </form>
}
