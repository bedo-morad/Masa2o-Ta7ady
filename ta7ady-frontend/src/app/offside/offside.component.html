<div class="challenge">
  <app-game-header title="أوفسايد" />

  <app-scoreboard [(teamA)]="teamA" [(teamB)]="teamB" [(scoreA)]="scoreA" [(scoreB)]="scoreB" />

  <app-timer [defaultSeconds]="5" timerKey="offside" label="مؤقت الكتابة" />

  <app-count-selector
    controlId="of-count"
    label="عدد القواعد"
    [count]="count()"
    [options]="[5, 10, 15, 20]"
    [loading]="loading()"
    (countChanged)="countChanged($event)"
    (redraw)="reload()"
  />

  @if (msg()) {
    <div class="notice">{{ msg() }}</div>
  }

  <ol class="rlist">
    @for (r of rows(); track r.id; let i = $index) {
      <li class="ritem">
        <button
          appAskedMarker
          class="rnum"
          [attr.name]="'asked-rule-' + (i + 1)"
          [number]="i + 1"
          [pressed]="asked().has(i)"
          [ariaLabel]="askedLabel(i)"
          (marked)="toggleAsked($event)"
        ></button>
        <span class="rtext">{{ r.ruleText }}</span>
        <button
          type="button"
          class="reroll"
          (click)="rerollOne(i)"
          [disabled]="rerolling() !== null"
          aria-label="تبديل هذه القاعدة"
          title="تبديل"
        >
          <i class="fa-solid fa-dice"></i>
        </button>
      </li>
    }
  </ol>
</div>
