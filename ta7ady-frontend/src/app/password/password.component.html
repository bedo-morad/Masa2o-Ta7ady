<div class="challenge">
  <app-game-header title="الباسورد" />

  <app-scoreboard [(teamA)]="teamA" [(teamB)]="teamB" [(scoreA)]="scoreA" [(scoreB)]="scoreB" />

  <app-timer timerKey="password" [defaultSeconds]="30" label="مؤقت المحاولة" />

  <app-count-selector
    controlId="pw-count"
    label="عدد البطاقات"
    [count]="count()"
    [options]="[5, 10, 15, 20]"
    [loading]="deck.loading()"
    (countChanged)="count.set($event)"
    (redraw)="deck.reload()"
  />

  <app-player-deck #deck [count]="count()" />
</div>
