<div class="challenge">
  <div class="topbar">
    <a routerLink="/" class="back"><i class="fa-solid fa-arrow-right"></i> رجوع</a>
    <a routerLink="/manage" class="manage"><i class="fa-solid fa-database"></i> إدارة الأسئلة</a>
  </div>

  <h2>الباسورد</h2>

  <app-scoreboard [(teamA)]="teamA" [(teamB)]="teamB" [(scoreA)]="scoreA" [(scoreB)]="scoreB" />

  <app-timer timerKey="password" [defaultSeconds]="30" label="مؤقت المحاولة" />

  <div class="draw-row">
    <label for="pw-count">عدد البطاقات</label>
    <select id="pw-count" [(ngModel)]="count">
      <option [ngValue]="5">5</option>
      <option [ngValue]="10">10</option>
      <option [ngValue]="15">15</option>
      <option [ngValue]="20">20</option>
    </select>
    <button type="button" class="redraw" (click)="reload()" [disabled]="loading()">
      <i class="fa-solid fa-shuffle"></i> سحب جديد
    </button>
  </div>

  @if (msg()) {
    <div class="notice">{{ msg() }}</div>
  }

  <div class="cards">
    @for (c of cards(); track c.row.id; let i = $index) {
      <div class="cell">
        <button
          type="button"
          class="flip"
          [class.open]="c.flipped"
          (click)="flip(i)"
          [attr.aria-label]="c.flipped ? c.row.playerName : 'بطاقة رقم ' + (i + 1)"
        >
          <span class="face front">{{ i + 1 }}</span>
          <span class="face back">{{ c.flipped ? c.row.playerName : '' }}</span>
        </button>
        @if (c.flipped) {
          <a
            class="gsearch"
            [appGoogleSearch]="c.row.playerName"
            searchLabel="بحث عن اللاعب"
            [stopPropagation]="true"
          ></a>
        }
        <button
          type="button"
          class="reroll"
          (click)="rerollOne(i)"
          [disabled]="rerolling() !== null"
          aria-label="تبديل هذه البطاقة"
          title="تبديل"
        >
          <i class="fa-solid fa-dice"></i>
        </button>
      </div>
    }
  </div>
</div>
