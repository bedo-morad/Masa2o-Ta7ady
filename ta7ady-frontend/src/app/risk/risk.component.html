<div class="challenge">
  <app-game-header title="ريسك" />

  <app-scoreboard [(teamA)]="teamA" [(teamB)]="teamB" [(scoreA)]="scoreA" [(scoreB)]="scoreB" />

  <app-timer timerKey="risk" [defaultSeconds]="30" label="مؤقت السؤال" />

  <div class="draw-row">
    <button type="button" class="redraw" (click)="reload()" [disabled]="loading()">
      <i class="fa-solid fa-shuffle"></i> سحب لوحة جديدة
    </button>
  </div>

  @if (msg()) {
    <div class="notice">{{ msg() }}</div>
  }

  @if (packs().length) {
    <app-risk-board
      [packs]="packs()"
      [seen]="seen()"
      [open]="open()"
      [double]="double()"
      [assignments]="assignments()"
      [teamA]="teamA()"
      [teamB]="teamB()"
      [rerolling]="rerolling()"
      (cellToggle)="toggleCell($event)"
      (columnReroll)="rerollColumn($event)"
      (assignment)="onAssign($event.key, $event.question, $event.change)"
    />

    <app-audit-strip [entries]="audit()" [teamA]="teamA()" [teamB]="teamB()" />
  }

  <section class="cards" aria-label="بطاقات الفريقين">
    <div class="card-col">
      <h4>{{ teamA() || 'الفريق الأول' }}</h4>
      @for (label of cardLabels; track $index; let i = $index) {
        <button
          type="button"
          class="card"
          [class.used]="cardUsed('A', i)"
          (click)="toggleCard('A', i)"
          [attr.aria-pressed]="cardUsed('A', i)"
          [attr.aria-label]="label"
        >
          <i
            class="fa-solid"
            [class.fa-circle-check]="cardUsed('A', i)"
            [class.fa-circle]="!cardUsed('A', i)"
            aria-hidden="true"
          ></i>
          <span>{{ label }}</span>
        </button>
      }
    </div>
    <div class="card-col">
      <h4>{{ teamB() || 'الفريق الثاني' }}</h4>
      @for (label of cardLabels; track $index; let i = $index) {
        <button
          type="button"
          class="card"
          [class.used]="cardUsed('B', i)"
          (click)="toggleCard('B', i)"
          [attr.aria-pressed]="cardUsed('B', i)"
          [attr.aria-label]="label"
        >
          <i
            class="fa-solid"
            [class.fa-circle-check]="cardUsed('B', i)"
            [class.fa-circle]="!cardUsed('B', i)"
            aria-hidden="true"
          ></i>
          <span>{{ label }}</span>
        </button>
      }
    </div>
  </section>
</div>
