<section class="board">
  <div class="prompt-row">
    <h3 class="prompt">{{ match().matchLabel }}</h3>
  </div>

  <div class="sides">
    <div class="side">
      <h4 class="side-name">{{ match().teamA }}</h4>
      <ol class="lineup">
        @for (p of match().lineupA; track $index; let i = $index) {
          <li>
            <button
              type="button"
              class="prow"
              [class.is-a]="assigned('A', i) === 'A'"
              (click)="toggle('A', i, p)"
              [attr.aria-pressed]="assigned('A', i) === 'A'"
              [attr.aria-label]="p"
            >
              <span class="pnum tabular-nums">{{ i + 1 }}</span>
              <span class="pname">{{ p }}</span>
              @if (assigned('A', i) === 'A') {
                <i class="fa-solid fa-check picked"></i>
              }
            </button>
          </li>
        }
      </ol>
    </div>

    <div class="side">
      <h4 class="side-name">{{ match().teamB }}</h4>
      <ol class="lineup">
        @for (p of match().lineupB; track $index; let i = $index) {
          <li>
            <button
              type="button"
              class="prow"
              [class.is-b]="assigned('B', i) === 'B'"
              (click)="toggle('B', i, p)"
              [attr.aria-pressed]="assigned('B', i) === 'B'"
              [attr.aria-label]="p"
            >
              <span class="pnum tabular-nums">{{ i + 1 }}</span>
              <span class="pname">{{ p }}</span>
              @if (assigned('B', i) === 'B') {
                <i class="fa-solid fa-check picked"></i>
              }
            </button>
          </li>
        }
      </ol>
    </div>
  </div>
</section>
