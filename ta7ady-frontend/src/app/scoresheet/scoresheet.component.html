<div class="challenge">
  <app-game-header title="ورقة النتائج" />

  <app-scoreboard [(teamA)]="teamA" [(teamB)]="teamB" [(scoreA)]="scoreA" [(scoreB)]="scoreB" />

  <div class="swap-row">
    <button type="button" class="swap" (click)="swapTeams()" aria-label="تبديل اسمي الفريقين">
      <i class="fa-solid fa-arrow-right-arrow-left"></i> تبديل الاسمين
    </button>
  </div>
  <app-timer timerKey="scoresheet" [defaultSeconds]="10" label="مؤقت المحاولة" />

  @if (current(); as strikeMatch) {
    <app-strike-tracker
      [slots]="slotsOf(strikeMatch)"
      [eliminationThreshold]="3"
      (bump)="onSlotBump(strikeMatch.id, $event)"
      (reset)="onSlotReset(strikeMatch.id, $event)"
      (rename)="onSlotRename(strikeMatch.id, $event)"
    />
  }

  <app-count-selector
    controlId="ss-count"
    label="عدد المباريات"
    [count]="count()"
    [options]="[1, 2, 3]"
    [loading]="loading()"
    (countChanged)="count.set($event)"
    (redraw)="reload()"
  />

  @if (msg()) {
    <div class="notice">{{ msg() }}</div>
  }

  @if (current(); as match) {
    <app-item-navigation
      [items]="matches()"
      [index]="idx()"
      itemLabel="المباراة"
      itemsLabel="المباريات"
      (previous)="prev()"
      (next)="next()"
      (select)="go($event)"
    />

    <app-scoresheet-lineups
      [match]="match"
      [assignments]="assignments()[match.id] ?? {}"
      (playerToggle)="onToggle(match, $event.side, $event.index, $event.player)"
    />

    <app-audit-strip [entries]="audit()" [teamA]="teamA()" [teamB]="teamB()" />
  }
</div>
