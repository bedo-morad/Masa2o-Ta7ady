<div class="challenge">
  <app-game-header title="ورقة النتائج" />

  <app-scoreboard [(teamA)]="teamA" [(teamB)]="teamB" [(scoreA)]="scoreA" [(scoreB)]="scoreB" />

  <div class="swap-row">
    <button type="button" class="swap" (click)="swapTeams()" aria-label="تبديل اسمي الفريقين">
      <i class="fa-solid fa-arrow-right-arrow-left"></i> تبديل الاسمين
    </button>
  </div>
  <app-timer timerKey="scoresheet" [defaultSeconds]="10" label="مؤقت المحاولة" />

  @if (current(); as strikeMatch) {
    <app-strike-tracker
      [slots]="slotsOf(strikeMatch)"
      [eliminationThreshold]="3"
      (bump)="onSlotBump(strikeMatch.id, $event)"
      (reset)="onSlotReset(strikeMatch.id, $event)"
      (rename)="onSlotRename(strikeMatch.id, $event)"
    />
  }

  <app-count-selector
    controlId="ss-count"
    label="عدد المباريات"
    [count]="count()"
    [options]="[1, 2, 3]"
    [loading]="loading()"
    (countChanged)="count.set($event)"
    (redraw)="reload()"
  />

  @if (msg()) {
    <div class="notice">{{ msg() }}</div>
  }

  @if (current(); as match) {
    <app-item-navigation
      [items]="matches()"
      [index]="idx()"
      itemLabel="المباراة"
      itemsLabel="المباريات"
      (previous)="prev()"
      (next)="next()"
      (select)="go($event)"
    />

    <section class="board">
      <div class="prompt-row">
        <h3 class="prompt">{{ match.matchLabel }}</h3>
      </div>

      <div class="sides">
        <div class="side">
          <h4 class="side-name">{{ match.teamA }}</h4>
          <ol class="lineup">
            @for (p of match.lineupA; track $index; let i = $index) {
              <li>
                <button
                  type="button"
                  class="prow"
                  [class.is-a]="assigned(match.id, keyOf('A', i)) === 'A'"
                  (click)="onToggle(match, 'A', i, p)"
                  [attr.aria-pressed]="assigned(match.id, keyOf('A', i)) === 'A'"
                  [attr.aria-label]="p"
                >
                  <span class="pnum tabular-nums">{{ i + 1 }}</span>
                  <span class="pname">{{ p }}</span>
                  @if (assigned(match.id, keyOf('A', i)) === 'A') {
                    <i class="fa-solid fa-check picked"></i>
                  }
                </button>
              </li>
            }
          </ol>
        </div>

        <div class="side">
          <h4 class="side-name">{{ match.teamB }}</h4>
          <ol class="lineup">
            @for (p of match.lineupB; track $index; let i = $index) {
              <li>
                <button
                  type="button"
                  class="prow"
                  [class.is-b]="assigned(match.id, keyOf('B', i)) === 'B'"
                  (click)="onToggle(match, 'B', i, p)"
                  [attr.aria-pressed]="assigned(match.id, keyOf('B', i)) === 'B'"
                  [attr.aria-label]="p"
                >
                  <span class="pnum tabular-nums">{{ i + 1 }}</span>
                  <span class="pname">{{ p }}</span>
                  @if (assigned(match.id, keyOf('B', i)) === 'B') {
                    <i class="fa-solid fa-check picked"></i>
                  }
                </button>
              </li>
            }
          </ol>
        </div>
      </div>
    </section>

    <app-audit-strip [entries]="audit()" [teamA]="teamA()" [teamB]="teamB()" />
  }
</div>
