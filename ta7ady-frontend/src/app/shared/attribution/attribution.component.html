<div class="attrib" [class.stretch]="stretch()">
  @if (showPoints()) {
    <span class="pts tabular-nums" [class.neg]="displayPoints() < 0">{{ fmt(displayPoints()) }}</span>
  }
  <div class="teams" role="group" [attr.aria-label]="label()">
    <button
      type="button"
      class="tbtn ta"
      [class.on]="assigned() === 'A'"
      (click)="tap('A')"
      [attr.aria-pressed]="assigned() === 'A'"
      [attr.aria-label]="teamA()"
    >
      {{ short() ? 'أ' : (teamA() || 'أ') }}
    </button>
    <button
      type="button"
      class="tbtn tb"
      [class.on]="assigned() === 'B'"
      (click)="tap('B')"
      [attr.aria-pressed]="assigned() === 'B'"
      [attr.aria-label]="teamB()"
    >
      {{ short() ? 'ب' : (teamB() || 'ب') }}
    </button>
  </div>
</div>
