<div class="draw-row">
  <label [attr.for]="id()">{{ label() }}</label>
  <select
    [id]="id()"
    [ngModel]="count()"
    (ngModelChange)="select($event)"
  >
    @for (option of options(); track option) {
      <option [ngValue]="option">{{ option }}</option>
    }
  </select>
  <button
    type="button"
    class="redraw"
    (click)="redrawRequested()"
    [disabled]="loading()"
  >
    <i class="fa-solid fa-shuffle"></i> سحب جديد
  </button>
</div>
