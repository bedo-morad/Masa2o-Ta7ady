<div class="challenge">
  <app-game-header title="مين في الصورة" />

  <app-scoreboard [(teamA)]="teamA" [(teamB)]="teamB" [(scoreA)]="scoreA" [(scoreB)]="scoreB" />

  <app-timer timerKey="whopicture" [defaultSeconds]="10" label="مؤقت التخمين" />

  <app-count-selector
    controlId="wp-count"
    label="عدد الصور"
    [count]="count()"
    [options]="[1, 2, 3, 4, 5]"
    [loading]="loading()"
    (countChanged)="count.set($event)"
    (redraw)="reload()"
  />

  @if (msg()) {
    <div class="notice">{{ msg() }}</div>
  }

  @if (current(); as photo) {
    <app-item-navigation
      [items]="photos()"
      [index]="idx()"
      itemLabel="الصورة"
      itemsLabel="الصور"
      (previous)="prev()"
      (next)="next()"
      (select)="go($event)"
    />

    <app-whopicture-photo-card
      [photo]="photo"
      [resetToken]="imageResetToken()"
      (shareNotice)="msg.set($event)"
    />

    <app-whopicture-name-list
      [players]="photo.players"
      [teamA]="teamA()"
      [teamB]="teamB()"
      [assignments]="assignments()[photo.id] ?? {}"
      (attributionChanged)="onNameAttribution(photo, $event)"
    />

    <app-strike-tracker
      [slots]="slotsOf(photo)"
      [eliminationThreshold]="2"
      (bump)="onSlotBump(photo.id, $event)"
      (reset)="onSlotReset(photo.id, $event)"
      (rename)="onSlotRename(photo.id, $event)"
    />
  }
</div>
